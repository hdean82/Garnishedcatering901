name: Garnished worker credential check
on:
  workflow_dispatch:
permissions: {}
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Confirm OpenAI credential is available
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY is missing"
            exit 1
          fi
          echo "OpenAI credential is configured."
